# hypridle — runs actions when the laptop is idle.
# Timeline: 4:30 dim → 5:00 lock → 5:30 screen-off → 15:00 suspend.
# Docs: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid duplicate locks
    before_sleep_cmd = loginctl lock-session     # lock before suspend
    after_sleep_cmd = hyprctl dispatch "hl.dsp.exec_raw('dpms on')"   # wake screen on resume (lua-config dispatch form)
}

# 4:30 — dim the screen as a "you're about to be locked" warning.
# `-s` saves the current brightness; `-r` restores it on any activity.
listener {
    timeout = 270
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5:00 — lock the session.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5:30 — turn the display off (restores brightness first so it isn't stuck dim).
listener {
    timeout = 330
    on-timeout = brightnessctl -r; hyprctl dispatch "hl.dsp.exec_raw('dpms off')"
    on-resume = hyprctl dispatch "hl.dsp.exec_raw('dpms on')"
}

# 15:00 — suspend.
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
