# hyprlock — lock screen (Super+Escape / auto via hypridle)
# Auto-themed: colors come from the wall-theme palette, background is the live
# desktop (blurred), so the lock screen always matches the current wallpaper.
# Docs: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

# Pull the generated palette ($background, $foreground, $accent, $accent2/3).
source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Live wallpaper, heavily blurred — matches whatever is on screen at lock time
# (works for both image and video wallpapers, unlike a fixed file path).
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    contrast = 0.9
    vibrancy = 0.15
}

# Dark overlay for contrast against bright wallpapers.
shape {
    monitor =
    size = 4000, 4000
    color = rgba(0, 0, 0, 0.35)
    rounding = 0
    border_size = 0
    zindex = -1
}

# ── Big clock ─────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $foreground
    font_size = 112
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 150
    halign = center
    valign = center
}

# ── Date (accent) ─────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $accent
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# ── Password input ────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 300, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $backgroundAlt
    font_color = $foreground
    placeholder_text = <span foreground="##888888"><i>󰌾  Enter password</i></span>
    check_color = $accent2
    fail_color = rgba(224, 108, 117, 1.0)
    fail_text = <i>󰀦 $FAIL (attempt $ATTEMPTS)</i>
    fade_on_empty = false
    rounding = 16
    position = 0, -40
    halign = center
    valign = center
}

# ── User line (below the input) ───────────────────────────────────────────
label {
    monitor =
    text =    $USER
    color = $foreground
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, -130
    halign = center
    valign = center
}

# ── Status row (battery · layout · now-playing · uptime) ──────────────────
label {
    monitor =
    text = cmd[update:5000] ~/.local/bin/hyprlock-status
    color = $accent3
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 48
    halign = center
    valign = bottom
}
