# /etc/keyd/default.conf
# macOS-style ⌘ Command: rewrite Super(meta)+letter → Ctrl+letter so Linux apps
# receive their native shortcuts while you press the Mac combo.
#
# Keys intentionally NOT remapped (so Hyprland can bind them on Super/⌘):
#   Space Return Tab ` Escape Q E H  digits 1-9  arrows  Print  F-keys
#
# Rollback:  sudo systemctl stop keyd      (keyboard returns to normal instantly)
# Live view: sudo keyd monitor             (shows what keyd emits)

[ids]
*

[meta]
# ── clipboard / edit ──
a = C-a
c = C-c
x = C-x
v = C-v
z = C-z
# ── file / navigation / view ──
s = C-s
f = C-f
g = C-g
l = C-l
n = C-n
o = C-o
p = C-p
r = C-r
t = C-t
w = C-w
# ── text formatting ──
b = C-b
i = C-i
u = C-u
# ── zoom ──
minus = C-minus
equal = C-equal
0 = C-0
# ── preferences (⌘,) ──
comma = C-comma
