# kitty terminal config
font_family      JetBrainsMono Nerd Font
font_size        11.0

# Appearance — frosted glass. Hyprland blurs whatever is behind the
# transparent background (that's what gives the macOS-like frosted look).
background_opacity 0.78
dynamic_background_opacity yes
window_padding_width 14
hide_window_decorations yes
cursor_shape     beam
cursor_blink_interval 0.5
scrollback_lines 10000
enable_audio_bell no
# macOS-feel niceties
placement_strategy center
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Catppuccin Mocha-ish palette
foreground #cdd6f4
background #1e1e2e
selection_foreground #1e1e2e
selection_background #f5e0dc
color0 #45475a
color8 #585b70
color1 #f38ba8
color9 #f38ba8
color2 #a6e3a1
color10 #a6e3a1
color3 #f9e2af
color11 #f9e2af
color4 #89b4fa
color12 #89b4fa
color5 #cba6f7
color13 #cba6f7
color6 #94e2d5
color14 #94e2d5
color7 #bac2de
color15 #a6adc8

# Dynamic palette generated from the wallpaper by wall-theme (overrides above).
include colors.conf

#===============================================================================
# macOS-style clipboard — keyd rewrites ⌘C/⌘V to Ctrl+C/Ctrl+V, so make those
# behave like macOS Terminal instead of the shell's interrupt/verbatim.
#===============================================================================
# ⌘C: copy the selection if there is one, otherwise send SIGINT (Ctrl-C).
map ctrl+c copy_and_clear_or_interrupt
# ⌘V: paste from clipboard.
map ctrl+v paste_from_clipboard
# Keep the Linux-standard combos working too.
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
